<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141e27" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VIC Recruitment 2026</title>
    <meta name="description" content="Control room for the Vision & Innovation Club's 2026 recruitment: binomes, interviewees, alerts and maintenance." />
    <script>
      // Apply the saved theme before first paint (light is the default, dark is opt-in) to avoid a flash.
      try {
        var t = localStorage.getItem("vic-theme") || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t);
      } catch (e) { document.documentElement.classList.add("light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
