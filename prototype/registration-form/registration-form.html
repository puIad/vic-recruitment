@font-face{font-family:"Magic School";font-display:swap;src:url(fonts/MagicSchoolOne.ttf) format("truetype")}

@property --bg{syntax:"<color>";inherits:true;initial-value:#141E27}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#141E27}
@property --accent{syntax:"<color>";inherits:true;initial-value:#69C4AF}
@property --ink{syntax:"<color>";inherits:true;initial-value:#0A1C18}
:root{
  --night:#141E27;--bg:#141E27;--bg2:#1c2c3a;--accent:#69C4AF;--ink:#0A1C18;
  --text:#fff;--muted:#A3AFBA;--line:rgba(255,255,255,.16);--card:rgba(255,255,255,.06);
  --paper:#EFEFEF;--paper-ink:#141E27;--paper-body:#3b4954;
  --radius:16px;--proto-h:58px;
  --serif:"Magic School","Cormorant Garamond",Georgia,serif;
  --serif-soft:"Cormorant Garamond",Georgia,serif;
  --sans:Gilroy,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  transition:--bg .7s ease,--bg2 .7s ease,--accent .7s ease,--ink .7s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--text);font:400 16px/1.55 var(--sans);
  background:radial-gradient(130% 60% at 50% -5%,var(--bg2) 0%,var(--bg) 62%) fixed,var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:var(--ink)}
/* charter: static grain at 7% and a vignette, never animated */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.38))}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background:
   radial-gradient(1.2px 1.2px at 12% 14%,#fff,transparent),radial-gradient(1px 1px at 78% 9%,#fff,transparent),
   radial-gradient(1.4px 1.4px at 44% 22%,#fff,transparent),radial-gradient(1px 1px at 90% 31%,#fff,transparent),
   radial-gradient(1px 1px at 6% 47%,#fff,transparent),radial-gradient(1.2px 1.2px at 63% 55%,#fff,transparent),
   radial-gradient(1px 1px at 30% 71%,#fff,transparent),radial-gradient(1.3px 1.3px at 88% 78%,#fff,transparent),
   radial-gradient(1px 1px at 52% 90%,#fff,transparent),radial-gradient(1px 1px at 18% 93%,#fff,transparent)}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;padding:0 20px calc(var(--proto-h) + 96px);outline:0}
@media(min-width:520px){#app{border-inline:1px solid rgba(255,255,255,.06)}}
h1,h2,h3,p{margin:0}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
.soft{font-family:var(--serif-soft);font-style:italic;font-weight:500}
.eyebrow{font:700 13px/1 var(--sans);color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px;min-height:64px}
.top img{height:34px;width:auto;display:block}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1 var(--sans);color:var(--muted);padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:rgba(0,0,0,.18)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.chip.lock i{background:none;border:1.5px solid var(--accent)}
.chip.pulse i{animation:pulse 1s ease 2}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font:700 17px/1 var(--sans);height:56px;padding:0 26px;border-radius:99px;
  background:var(--accent);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.link:focus-visible,.rate button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);width:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{appearance:none;background:none;border:0;color:var(--accent);font:700 15px/1.2 var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.link[disabled]{color:var(--muted);text-decoration:none;cursor:default}

.actions{position:sticky;bottom:calc(var(--proto-h) + 6px);z-index:5;display:flex;gap:10px;padding:18px 0 10px;margin-top:20px;
  background:linear-gradient(to top,var(--bg) 55%,transparent)}
.actions .btn:first-child:not(:only-child){flex:0 0 auto}
.actions .btn.grow{flex:1}

/* fields */
.field{margin:0 0 26px;scroll-margin-top:80px}
.field>label,.field>.lab{display:block;font:700 16px/1.35 var(--sans);margin-bottom:6px}
.opt-tag{font:400 13px/1 var(--sans);color:var(--muted);margin-left:6px}
.help{font-size:13.5px;line-height:1.45;color:var(--muted);margin:-2px 0 10px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{
  width:100%;font:400 16px/1.4 var(--sans);color:var(--text);background:rgba(255,255,255,.07);color-scheme:dark;
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:52px;appearance:none;transition:border-color .2s,background .2s}
textarea{min-height:128px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7f8c97}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:rgba(255,255,255,.1);outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 35%,transparent)}
.opts{display:grid;gap:8px}
.opts.cols{grid-template-columns:1fr 1fr}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opt{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:52px;padding:10px 14px;color:var(--text);
  font:700 15px/1.3 var(--sans);background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid #6c7a86;border-radius:50%;display:grid;place-items:center}
.opt.many .mk{border-radius:6px}
.opt[aria-checked=true]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 16%,transparent)}
.opt[aria-checked=true] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked=true] .mk::after{content:"";width:9px;height:5px;border:2px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt:not(.many)[aria-checked=true] .mk::after{width:8px;height:8px;border:0;background:var(--ink);border-radius:50%;transform:none}
.opt small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--muted)}
.rate{display:flex;gap:8px}
.rate button{appearance:none;flex:1;height:52px;border-radius:14px;color:var(--text);font:900 18px/1 var(--sans);background:rgba(255,255,255,.05);border:1.5px solid var(--line);cursor:pointer}
.rate button[aria-checked=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.rate-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.other{margin-top:8px}
/* errors: a light chip, so it reads on every wash and never fights the red house */
.msg{display:none}
.field.err .msg,.ticket-err{display:flex}
.msg,.ticket-err{align-items:flex-start;gap:8px;margin-top:9px;padding:9px 12px;border-radius:12px;background:#FFE7DF;color:#6B1B07;font:700 14px/1.35 var(--sans)}
.msg::before,.ticket-err::before{content:"!";flex:none;width:19px;height:19px;border-radius:50%;background:#6B1B07;color:#FFE7DF;display:grid;place-items:center;font:900 12px/1 var(--sans);margin-top:1px}
.field.err input,.field.err textarea,.field.err .opt,.field.err .rate button{border-color:#FFB9A4}
.field.err input,.field.err textarea{border-width:2px}
.ok-note{display:flex;gap:8px;align-items:center;color:var(--accent);font:700 14px/1.3 var(--sans)}
.proto-note{margin:14px 0 0;padding:9px 12px;border:1.5px dashed rgba(255,255,255,.35);border-radius:12px;font:400 12.5px/1.45 var(--sans);color:#d6dde3}
.proto-note b{color:#fff}

/* letter */
.hero{padding:10px 0 4px;text-align:center}
.hero h1{font-size:44px;line-height:1.05;margin:6px 0 4px}
.letter{position:relative;margin:22px 0 22px;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:30px 24px 26px;
  box-shadow:0 26px 60px -20px rgba(0,0,0,.65),inset 0 0 0 1px rgba(20,30,39,.08)}
.letter .greet{font:italic 600 30px/1.1 var(--serif-soft);margin-bottom:14px}
.letter p{color:var(--paper-body);font-size:16.5px;line-height:1.6;margin-bottom:12px}
.letter p b{color:var(--paper-ink)}
.letter .sign{font:700 15px/1.3 var(--sans);color:var(--paper-ink);margin:16px 0 0}
.seal{position:absolute;right:20px;bottom:-22px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;
  font:900 22px/1 var(--sans);box-shadow:0 8px 18px -6px rgba(0,0,0,.6),inset 0 0 0 4px rgba(0,0,0,.08)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.meta .chip{color:#d8e0e6}
.back-card{border:1.5px solid color-mix(in oklab,var(--accent) 60%,transparent);background:color-mix(in oklab,var(--accent) 10%,transparent);border-radius:16px;padding:16px;margin:0 0 20px}
.back-card b{display:block;font-size:17px;margin-bottom:2px}
.back-card .row{display:flex;gap:14px;align-items:center;margin-top:10px}
.small{font-size:13.5px}

/* ticket / platform */
.ticket{margin:18px 0 8px}
.ticket h2{font-size:38px;line-height:1.05;margin:6px 0 10px}
.ticket .lead{color:#dbe3e9;margin-bottom:20px}
.slots{position:relative}
.slots input{letter-spacing:.62em;text-indent:.28em;font:900 30px/1 var(--sans);text-align:left;padding:0 0 0 18px;height:68px;font-variant-numeric:tabular-nums;background-image:none}
.stub{border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:18px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);margin-top:-9px;border:1.5px solid var(--line)}
.stub::before{left:-10px;clip-path:inset(0 0 0 50%)}.stub::after{right:-10px;clip-path:inset(0 50% 0 0)}
.countdown{font:700 14px/1 var(--sans);color:var(--muted)}
.verified{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:color-mix(in oklab,var(--accent) 14%,transparent);border:1.5px solid color-mix(in oklab,var(--accent) 55%,transparent);font:700 15px/1.3 var(--sans)}
.verified .tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.verified .tick::after{content:"";width:10px;height:5.5px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.verified small{display:block;font:400 13px/1.3 var(--sans);color:var(--muted)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}

/* journey rails */
.rail{display:flex;align-items:center;gap:0;margin:8px 0 18px}
.rail .stop{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid #5b6a77;background:var(--bg);transition:all .4s}
.rail .seg{flex:1;height:2px;background:#33424f;position:relative}
.rail .seg::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .5s}
.rail .done.seg::after{transform:scaleX(1)}
.rail .stop.done{background:var(--accent);border-color:var(--accent)}
.rail .stop.now{width:20px;height:20px;border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 5px color-mix(in oklab,var(--accent) 28%,transparent)}
.stopline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
.stopline .eyebrow{white-space:nowrap}
.step-title{font-size:40px;line-height:1.05;margin:4px 0 6px}
.step-sub{color:#cfd8df;margin-bottom:24px}
.stepwrap{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* A: the road */
.road{position:relative;padding-left:46px}
.road::before{content:"";position:absolute;left:14px;top:12px;bottom:0;width:2px;background:#33424f}
.road .fill{position:absolute;left:14px;top:12px;width:2px;background:var(--accent);height:0;transition:height .6s ease}
.gsec{position:relative;padding-bottom:18px;scroll-margin-top:70px}
.gsec .pin{position:absolute;left:-46px;top:6px;width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid #5b6a77;display:grid;place-items:center;font:900 13px/1 var(--sans);color:var(--muted);transition:all .4s}
.gsec.done .pin{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.gsec.live .pin{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 5px color-mix(in oklab,var(--accent) 25%,transparent)}
.gsec h2{font-size:34px;line-height:1.08;margin:3px 0 6px}
.gsec .sub{color:#cfd8df;margin-bottom:22px}
.gsec.ghost{opacity:.5}
.gsec.ghost .skeleton{border:1.5px dashed var(--line);border-radius:14px;padding:16px;font-size:14.5px;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:6;margin:0 -20px;padding:10px 20px 8px;background:linear-gradient(var(--bg) 70%,transparent)}
.topbar .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar .thin{height:3px;border-radius:3px;background:#2b3945;margin-top:8px;overflow:hidden}
.topbar .thin i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.summary{display:none;margin:0 0 16px;padding:12px 14px;border-radius:14px;background:#FFE7DF;color:#6B1B07;font:700 14.5px/1.35 var(--sans)}
.summary.on{display:block}
.summary button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* sorting */
.sorting h2{font-size:42px;line-height:1.04;margin:6px 0 8px}
.tiles{display:grid;gap:12px;margin:20px 0 6px}
.tile{appearance:none;text-align:left;width:100%;cursor:pointer;color:var(--text);padding:18px 18px 16px;border-radius:20px;border:1.5px solid var(--line);
  background:linear-gradient(135deg,color-mix(in oklab,var(--h) 22%,transparent),rgba(255,255,255,.03));font-family:var(--sans);position:relative;overflow:hidden;
  transition:transform .25s ease,border-color .3s,box-shadow .3s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--h)}
.tile .code{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.tile .code b{font:900 34px/1 var(--sans)}
.tile .code span{font:italic 600 24px/1 var(--serif-soft);color:var(--h)}
.tile .dn{font:700 14px/1.3 var(--sans);color:#e6ecf0;margin-bottom:6px}
.tile p{font-size:14.5px;line-height:1.5;color:#c7d1d9}
.tile[aria-checked=true]{border-color:var(--h);box-shadow:0 0 0 3px color-mix(in oklab,var(--h) 40%,transparent),0 18px 40px -18px var(--h);transform:scale(1.015)}
.tile[aria-checked=true]::after{content:"Your 1st choice";position:absolute;right:14px;top:14px;font:700 12px/1 var(--sans);background:var(--h);color:#0b0b0b;padding:6px 10px;border-radius:99px}
.tiles.picked .tile[aria-checked=false]{opacity:.62}
.second{margin-top:26px}
.second .opts{grid-template-columns:1fr 1fr}
.opt .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--h)}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:7px;font:700 13px/1 var(--sans);padding:7px 11px;border-radius:99px;border:1.5px solid var(--h);color:var(--text);background:color-mix(in oklab,var(--h) 18%,transparent)}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--h)}
.washnote{margin-top:14px;font-size:14px;color:#cfd8df}

/* C */
.c-wrap{min-height:calc(100dvh - 64px);display:flex;flex-direction:column}
.c-top{position:sticky;top:0;z-index:6;margin:0 -20px;padding:12px 20px 10px;background:linear-gradient(var(--bg) 72%,transparent)}
.c-line{position:relative;height:4px;border-radius:4px;background:#2b3945;margin:10px 0 6px}
.c-line i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);transition:width .5s}
.c-line b{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid #5b6a77;transform:translateX(-50%)}
.c-line b.on{background:var(--accent);border-color:var(--accent)}
.c-count{display:flex;justify-content:space-between;font:700 13px/1 var(--sans);color:var(--muted)}
.c-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 10px;animation:rise .4s ease both}
.c-q{font:900 31px/1.12 var(--sans);letter-spacing:-.02em;margin:8px 0 8px}
.c-help{color:#cfd8df;font-size:15px;margin-bottom:22px}
.c-body .field{margin:0}
.c-body .field>label,.c-body .field>.lab{display:none}
.c-body .help{display:none}
.c-section{font:italic 600 24px/1 var(--serif-soft);color:var(--accent)}
.c-body .field>.opt-tag{display:none}
.review{display:grid;gap:8px;margin:6px 0 4px}
.review div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:14.5px}
.review span{color:var(--muted)}.review b{text-align:right}

/* owl */
.owlpage{min-height:100dvh;display:grid;place-content:center;text-align:center;gap:10px;padding:40px 0;overflow:hidden}
.sky{position:relative;height:150px;overflow:visible}
.flyer{position:absolute;top:30px;left:50%;width:150px;margin-left:-75px;animation:fly 3.2s cubic-bezier(.35,.1,.3,1) both}
@keyframes fly{0%{transform:translate(-120vw,34px) rotate(-6deg)}55%{transform:translate(0,-6px) rotate(0)}100%{transform:translate(0,0) rotate(0)}}
.wing{transform-origin:60px 36px;animation:flap .42s ease-in-out 8 alternate both}
.wing.r{transform-origin:60px 36px;animation-direction:alternate-reverse}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.owlpage h1{font-size:40px;line-height:1.05}
.dots span{display:inline-block;animation:blink 1.2s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* done */
.done h1{font-size:48px;line-height:1.02;margin:10px 0 10px}
.receipt{margin:22px 0;padding:18px;border-radius:20px;border:1.5px solid var(--line);background:var(--card)}
.receipt li{margin:0 0 10px;list-style:none;display:flex;gap:12px}
.receipt ul{margin:0;padding:0}
.receipt li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--ink);font:900 13px/24px var(--sans);text-align:center;font-style:normal}
.done .seal{position:static;margin:0 auto 6px;width:72px;height:72px;font-size:30px}

/* prototype bar */
#proto{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:2px;
  background:#fff;color:#111;border-radius:99px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.5);font:700 13px/1 var(--sans);max-width:calc(100vw - 16px)}
#proto button{appearance:none;border:0;background:none;color:#111;font:inherit;height:42px;min-width:42px;border-radius:99px;cursor:pointer;padding:0 10px;white-space:nowrap}
#proto button:hover{background:#eee}
#plabel{padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;text-align:center}
#pmenu{position:fixed;left:50%;bottom:calc(var(--proto-h) + 14px);transform:translateX(-50%);z-index:49;width:min(420px,calc(100vw - 16px));background:#fff;color:#111;border-radius:20px;
  padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);font:400 14px/1.4 var(--sans);max-height:70dvh;overflow:auto}
#pmenu[hidden]{display:none}
#pmenu h4{margin:0 0 6px;font:900 12px/1 var(--sans);text-transform:none;color:#555;letter-spacing:.04em}
#pmenu .g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#pmenu .g button{border:1.5px solid #cfd5da;background:#fff;color:#111;border-radius:99px;padding:8px 12px;font:700 13px/1 var(--sans);cursor:pointer}
#pmenu .g button[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
#pmenu .hint{font-size:12.5px;color:#555;margin:0}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .flyer{transform:none}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="app" tabindex="-1"></div>
<div id="pmenu" hidden></div>
<div id="proto" role="toolbar" aria-label="Prototype controls">
  <button data-p="prev" aria-label="Previous variant">&#8249;</button>
  <span id="plabel"></span>
  <button data-p="next" aria-label="Next variant">&#8250;</button>
  <button data-p="menu" aria-label="Prototype menu" aria-expanded="false">Jump</button>
</div>

function hasDraft(){const d=store.get(SKEY);return d&&d.ans&&Object.keys(d.ans).length>0}

/* ---------- validation (soft checks are comp proposals; the Google Form has none) ---------- */
function check(id){
  const q=Q[id], v=S.ans[id];
  const empty=v==null||v===""||(Array.isArray(v)&&v.length===0);
  if(q.req&&empty) return q.type==="one"||q.type==="chips"||q.type==="rate"||q.type==="dept1"||q.type==="dept2"?"Pick one to go on.":q.type==="many"?"Pick at least one.":"This one needs an answer.";
  if(empty) return "";
  if((v==="__other"||(Array.isArray(v)&&v.includes("__other")))&&!(S.ans["o"+id]||"").trim()) return "Tell us what “Other” is.";
  if(id===5&&String(v).replace(/\D/g,"").length<9) return "That number looks short. Algerian numbers have 10 digits, like 0555 12 34 56.";
  if(id===6&&!/(facebook\.com|fb\.com|fb\.me)/i.test(v)) return "Paste the link to your Facebook profile. It contains facebook.com.";
  if(id===4){const y=new Date().getFullYear()-new Date(v).getFullYear();if(!(y>=15&&y<=40))return "Check the year. That would make you "+y+".";}
  if(id===14&&v===S.ans[13]) return "Pick a different department from your 1st choice.";
  return "";
}
function validate(ids){
  let first=null,n=0;
  for(const id of ids){const m=check(id);if(m){S.err[id]=m;n++;if(first==null)first=id}else delete S.err[id]}
  return {n,first};
}

/* send / verify (all fake) */
function doSend(resend){
  if(!resend){
    const e=(S.email||"").trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+$/.test(e)){S.tkErr="Enter your ENP address, like name@g.enp.edu.dz.";return false}
    if(!e.endsWith("@g.enp.edu.dz")){S.tkErr="Only ENP addresses (ending @g.enp.edu.dz) can register here. Use your student mail, not Gmail.";return false}
    S.email=e;
  }
  if(S.sent>=3){S.tkErr="You have asked for 3 tickets this hour. Try again in 58 minutes.";return false}
  S.sent++;S.sentTo=S.email;S.tkErr="";S.tries=0;S.resendAt=Date.now()+RESEND_S*1000;return true;
}
function doVerify(code){
  if(code.length<6){S.tkErr="Type all 6 digits.";return false}
  if(S.tries>=5){S.tkErr="Too many tries. Ask for a new ticket.";return false}
  if(code!==CODE_OK){S.tries++;const l=5-S.tries;S.tkErr=l>0?`That code does not match. ${l} ${l===1?"try":"tries"} left.`:"Too many tries. Ask for a new ticket.";return false}
  if(/dup/.test(S.email)){S.tkErr="This address already has a registration. We have it, so there is nothing more to do. Check your ENP inbox for our mail.";S.tkDup=true;return false}
  S.proof=true;S.tkErr="";store.set(PKEY,{email:S.email,at:Date.now()},true);return true;
}

/* ---------- VARIANT C: one at a time ---------- */
function seqC(){
  const s=[];
  for(const g of GROUPS){
    if(g.dynamic){const ids=S.house?DEPTQ[S.house]:[15,16,17,18];ids.forEach(id=>s.push({q:id,g:g.id}));continue}
    if(g.sorting){s.push({q:13,g:"choose"});s.push({q:14,g:"choose"});continue}
    g.q.forEach(id=>s.push({q:id,g:g.id}));

  }
  return s;
}
function renderC(){
  if(S.screen==="letter") return `${topBar(draftChip())}${letterBlock()}<div class="actions"><button class="btn" data-act="start">Go to Platform 9¾</button></div>`;
  if(S.screen==="ticket") return `${topBar(draftChip())}${ticketBlock()}`;
  const seq=seqC(), i=Math.min(S.qi,seq.length-1), cur=seq[i];
  const bounds=[];let last=null;seq.forEach((s,k)=>{if(last&&s.g!==last)bounds.push(k);last=s.g});
  const pct=Math.round(i/(seq.length-1)*100);
  const gName={who:"Who you are",reach:"Where we can reach you",study:"Your studies",story:"Your story",choose:"The choosing",dept:S.house?HOUSES[S.house].dept:"Your department",interview:"Interview details",last:"Almost done"}[cur.g];
  const c=cur.review
    ? `<p class="c-section">${gName}</p><h2 class="c-q">Ready to join the family?</h2><p class="c-help">Check the short version, then send your letter.</p>${reviewBlock()}`
    : `<p class="c-section">${gName}</p>${cur.q===13?`<h2 class="c-q serif" style="font-weight:400;font-size:44px;line-height:1.02">The choosing</h2><p class="c-help">Tap the department that calls to you. Your house takes the colour of the room.</p>`:`<h2 class="c-q">${esc(Q[cur.q].t)}${Q[cur.q].req?"":` <span class="opt-tag">optional</span>`}</h2>${Q[cur.q].help?`<p class="c-help">${esc(Q[cur.q].help)}</p>`:`<div style="height:14px"></div>`}`}${field(cur.q)}`;
  const isLast=!!cur.review;
  return `<div class="c-wrap"><div class="c-top"><div style="display:flex;justify-content:space-between;align-items:center"><img src="${LOGO}" alt="Vision & Innovation Club" style="height:28px">${draftChip()}</div>
    <div class="c-line" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i>${bounds.map(b=>`<b class="${b<=i?"on":""}" style="left:${b/(seq.length-1)*100}%"></b>`).join("")}</div>
    <div class="c-count"><span>${i+1} of ${seq.length}</span><span>${S.house?HOUSES[S.house].house:""}</span></div></div>
    <div class="c-body" id="stepwrap" data-beat="${cur.g==="who"?"questions":cur.g==="choose"?"sorting":cur.g}"><div class="summary" id="summary" role="alert"></div>${c}</div>
    <div class="actions">${i>0?`<button class="btn ghost" data-act="back">Back</button>`:""}<button class="btn grow" data-act="${isLast?"submit":"next"}">${isLast?"Send by owl":"Continue"}</button></div></div>`;
}

/* ---------- render ---------- */
function render(keep){
  const y=window.scrollY;
  applyHouse();
  let html;
  if(S.screen==="owl")html=owlPage();
  else if(S.screen==="done")html=doneScreen();
  else html=S.v==="A"?renderA():S.v==="B"?renderB():renderC();
  app.innerHTML=html;
  $("#plabel").textContent=`${S.v} · ${VNAME[S.v]}`;
  if(keep)window.scrollTo(0,y);
  else if(!(S.v==="A"&&S.screen!=="owl"&&S.screen!=="done"))window.scrollTo(0,0);
  tickCountdown();
}
let cdT;
function tickCountdown(){
  clearInterval(cdT);
  const r=$("#resend");if(!r)return;
  cdT=setInterval(()=>{const b=$("#resend");if(!b){clearInterval(cdT);return}
    const left=Math.max(0,Math.ceil((S.resendAt-Date.now())/1000));
    b.textContent=left>0?`Send another in ${left}s`:"Send another ticket";b.disabled=left>0;if(!left)clearInterval(cdT)},500);
}

/* ---------- navigation ---------- */
function toTicket(){S.screen="ticket";render()}
function afterProof(){
  S.screen="form";
  if(S.v==="A"){render();setTimeout(()=>{const g=$("#g-who");g&&g.scrollIntoView({behavior:"smooth",block:"start"})},50)} else render();
}
function stepIds(){
  if(S.v==="B"){return idsOfGroup(GROUPS[S.step])}
  const seq=seqC(),cur=seq[Math.min(S.qi,seq.length-1)];return cur.review?[]:[cur.q];
}
function showSummary(v){
  const el=$("#summary");if(!el)return;
  if(!v.n){el.classList.remove("on");return}
  el.innerHTML=`${v.n===1?"One answer needs a look":v.n+" answers need a look"}. <button data-act="gofirst" data-id="${v.first}">Take me to the first</button>`;el.classList.add("on");
}
function go(dir){
  if(dir>0){
    const v=validate(stepIds());
    if(v.n){render(true);showSummary(v);const f=document.querySelector(`[data-fq="${v.first}"]`);f&&f.scrollIntoView({behavior:"smooth",block:"center"});return}
  }
  if(S.v==="B"){S.step=Math.max(0,Math.min(GROUPS.length-1,S.step+dir))}
  else{S.qi=Math.max(0,S.qi+dir);const L=seqC().length;if(S.qi>=L)S.qi=L-1}
  saveDraft();render();
}
function submit(){
  const v=validate(allIds());
  if(v.n){
    if(S.v==="B"){ // jump to the first step holding an error
      const gi=GROUPS.findIndex(g=>idsOfGroup(g).includes(v.first));if(gi>=0)S.step=gi}
    if(S.v==="C"){const k=seqC().findIndex(s=>s.q===v.first);if(k>=0)S.qi=k}
    render(true);showSummary(v);
    const f=document.querySelector(`[data-fq="${v.first}"]`);f&&f.scrollIntoView({behavior:"smooth",block:"center"});return}
  S.screen="owl";render();
  clearTimeout(window._owl);window._owl=setTimeout(()=>{if(S.screen==="owl"){S.screen="done";render()}},window.matchMedia("(prefers-reduced-motion: reduce)").matches?900:3600);
}

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="start")toTicket();
  else if(a==="send"){S.email=($("#tk-email")||{}).value||S.email;if(doSend(false)){render();setTimeout(()=>{const c=$("#tk-code");c&&c.focus()},60)}else render(true)}
  else if(a==="resend"){if(doSend(true))render(true);else render(true)}
  else if(a==="wrongmail"){S.sentTo="";S.tkErr="";render(true)}
  else if(a==="verify"){const c=($("#tk-code")||{}).value||"";if(doVerify(c)){afterProof()}else render(true)}
  else if(a==="resume"){loadDraft();if(S.proof){S.screen="form"}else S.screen="ticket";render()}
  else if(a==="clear"){store.del(SKEY);S.ans={};S.house=null;S.step=0;S.qi=0;S.saved=false;render(true)}
  else if(a==="next")go(1);
  else if(a==="back")go(-1);
  else if(a==="submit")submit();
  else if(a==="house"){pickHouse(b.dataset.h);S.err[14]&&delete S.err[14];render(true);
    if(S.v==="C")setTimeout(()=>go(1),650)}
  else if(a==="one"){const id=+b.dataset.q,v=b.dataset.v;S.ans[id]=v;delete S.err[id];
    if(id===14){S.ans[14]=v}
    saveDraft();refreshField(id);
    if(S.v==="C"&&id!==14&&!Q[id].other&&v!=="__other")setTimeout(()=>go(1),420)}
  else if(a==="many"){const id=+b.dataset.q,v=b.dataset.v;const arr=Array.isArray(S.ans[id])?S.ans[id].slice():[];
    const k=arr.indexOf(v);k>=0?arr.splice(k,1):arr.push(v);S.ans[id]=arr;delete S.err[id];saveDraft();refreshField(id)}
  else if(a==="gofirst"){const f=document.querySelector(`[data-fq="${b.dataset.id}"]`);f&&f.scrollIntoView({behavior:"smooth",block:"center"})}
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.tk==="email"){S.email=t.value;return}
  if(t.dataset.tk==="code"){t.value=t.value.replace(/\D/g,"").slice(0,6);if(t.value.length===6){S.tkErr="";if(doVerify(t.value))afterProof();else render(true)}return}
  if(t.dataset.q){
    const k=t.dataset.q;S.ans[k[0]==="o"?k:+k]=t.value;
    const f=t.closest(".field");if(f&&f.classList.contains("err")){const id=+(f.dataset.fq);delete S.err[id];f.classList.remove("err")}
    saveDraft();
  }
});

/* ---------- prototype bar ---------- */
function setV(v,noRender){
  S.v=v;const u=new URL(location.href);u.searchParams.set("v",v);history.replaceState(null,"",u);
  if(!noRender){S.screen=S.screen==="owl"||S.screen==="done"?S.screen:(S.proof?"form":S.screen);render()}
}
function cycle(d){const L=["A","B","C"];setV(L[(L.indexOf(S.v)+d+3)%3])}
function jump(beat){
  clearTimeout(window._owl);
  const needProof=!["letter","ticket"].includes(beat);
  if(beat==="letter"){S.screen="letter";S.proof=false}
  else if(beat==="ticket"){S.screen="ticket";S.proof=false;S.sentTo="";S.tkErr="";S.tkNote="";S.sent=0}
  else{
    S.proof=true;S.email=S.email||"test.candidate@g.enp.edu.dz";store.set(PKEY,{email:S.email,at:Date.now()},true);
    S.screen="form";
    if(beat==="questions"){S.step=0;S.qi=0}
    else if(beat==="sorting"){fill("story");S.house=null;delete S.ans[13];delete S.ans[14];S.step=4;S.qi=seqC().findIndex(s=>s.q===13)}
    else if(beat==="dept"){fill("choose");S.step=5;S.qi=seqC().findIndex(s=>s.g==="dept")}
    else if(beat==="interview"){fill("dept");S.step=6;S.qi=seqC().findIndex(s=>s.g==="interview")}
    else if(beat==="done"){fill("all");S.step=7;S.qi=seqC().findIndex(s=>s.g==="last")}
    else if(beat==="owl"){fill("all");S.screen="owl"}
    else if(beat==="received"){fill("all");S.screen="done"}
  }
  render();
  if(beat==="owl"){window._owl=setTimeout(()=>{if(S.screen==="owl"){S.screen="done";render()}},3600)}
  if(S.v==="A"&&S.screen!=="owl"&&S.screen!=="done"){
    setTimeout(()=>{const t=document.querySelector(`[data-beat="${beat}"]`);t&&t.scrollIntoView({behavior:"auto",block:"start"})},40)}
}
function menu(){
  const m=$("#pmenu");
  const beats=[["letter","Letter"],["ticket","Platform 9¾"],["questions","Questions"],["sorting","Choosing"],["dept","Department"],["interview","Interview"],["done","Almost done"],["owl","Owl post"],["received","Received"]];
  m.innerHTML=`<h4>JUMP TO A BEAT (fills synthetic answers up to it)</h4><div class="g">${beats.map(b=>`<button data-j="${b[0]}">${b[1]}</button>`).join("")}</div>
  <h4>HOUSE (changes the 1st choice)</h4><div class="g">${["none",...HORDER].map(k=>`<button data-h="${k}" aria-pressed="${(S.house||"none")===k}">${k==="none"?"Plain night":k+" · "+HOUSES[k].house}</button>`).join("")}</div>
  <h4>STATES</h4><div class="g"><button data-s="expire">Ticket expired (60 min later)</button><button data-s="skipwait">Skip resend wait</button><button data-s="fill">Fill the rest</button><button data-s="clear">Clear draft and restart</button><button data-s="reload">Reload (draft survives)</button></div>
  <p class="hint">Variants: ← → keys or the arrows. Everything stays on this device; nothing is sent.</p>`;
}
document.getElementById("proto").addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(!b)return;
  if(b.dataset.p==="prev")cycle(-1);else if(b.dataset.p==="next")cycle(1);
  else{const m=$("#pmenu");m.hidden=!m.hidden;b.setAttribute("aria-expanded",String(!m.hidden));if(!m.hidden)menu()}
});
$("#pmenu").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.j){jump(b.dataset.j);$("#pmenu").hidden=true}
  else if(b.dataset.h){const k=b.dataset.h;if(k==="none"){S.house=null;delete S.ans[13]}else{S.house=k;S.ans[13]=k;if(S.ans[14]===k)delete S.ans[14]}applyHouse();saveDraft();render(true);menu()}
  else if(b.dataset.s==="expire"){S.proof=false;S.sentTo="";S.tkErr="";S.tkNote="expired";store.del(PKEY,true);S.screen="ticket";render();$("#pmenu").hidden=true}
  else if(b.dataset.s==="skipwait"){S.resendAt=0;render(true)}
  else if(b.dataset.s==="fill"){fill("all");saveDraft();render(true)}
  else if(b.dataset.s==="clear"){store.del(SKEY);store.del(PKEY,true);location.href=location.pathname+"?v="+S.v}
  else if(b.dataset.s==="reload"){saveDraft();setTimeout(()=>location.reload(),400)}
});
addEventListener("keydown",e=>{
  const t=e.target;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)return;
  if(e.key==="ArrowLeft")cycle(-1);else if(e.key==="ArrowRight")cycle(1)
});

/* ---------- boot ---------- */
(function boot(){
  const p=new URLSearchParams(location.search);
  S.v=["A","B","C"].includes((p.get("v")||"").toUpperCase())?p.get("v").toUpperCase():"A";
  const pr=store.get(PKEY,true);
  if(pr&&Date.now()-pr.at<60*60*1000){S.proof=true;S.email=pr.email}
  if(S.proof){if(hasDraft())loadDraft();S.screen="form"} // reload inside the hour: straight back in
  const h=p.get("house");if(h&&HOUSES[h]){S.house=h;S.ans[13]=h}
  render();
  const beat=p.get("beat");if(beat)jump(beat);
})();
</script>
